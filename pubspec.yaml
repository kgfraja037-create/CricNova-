name: cricnova
description: "Premium cricket tournament and community app with real-time cloud syncing."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # State Management
  provider: ^6.0.0
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.1
  
  # Database & Supabase
  supabase_flutter: ^1.10.0
  supabase: ^1.10.0
  
  # Authentication
  jwt_decoder: ^2.0.1
  crypto: ^3.0.2
  
  # Storage
  shared_preferences: ^2.2.2
  
  # UI & Animations
  flutter_animate: ^4.1.1
  lottie: ^2.6.0
  google_fonts: ^6.1.0
  glassmorphism: ^3.0.0
  neumorphic_ui: ^0.0.3
  
  # Image Handling
  image_picker: ^1.0.4
  cached_network_image: ^3.3.1
  
  # Location & Maps
  geolocator: ^9.0.2
  google_maps_flutter: ^2.5.3
  
  # Real-time
  web_socket_channel: ^2.4.0
  socket_io_client: ^2.0.2
  
  # Notifications
  firebase_messaging: ^14.6.0
  firebase_core: ^2.24.0
  
  # Date & Time
  intl: ^0.19.0
  
  # Video Handling
  video_player: ^2.7.0
  
  # QR Code
  qr_code_scanner: ^1.0.1
  
  # Payments
  razorpay_flutter: ^1.3.6
  
  # Analytics
  firebase_analytics: ^10.7.0
  
  # Error Handling
  get_it: ^7.6.0
  
  # Validation
  validators: ^4.0.0
  
  # URL Launcher
  url_launcher: ^6.2.1
  
  # Loading & Shimmer
  shimmer: ^3.0.0
  
  # Permission Handling
  permission_handler: ^11.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/logos/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500